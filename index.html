<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮Memory game🎮</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link rel="shortcut icon" href="favicon-32x32.png" type="image/x-icon">
</head>
<body>
    <main class="wrapper">
        <!-- onboarding card ui -->
        <div class="onboarding card">
            <h1 class="title">memory game</h1>
            <p class="info-text">welcome to a short memory game, your goal is to match all the pairs by colour within the shortest amount of time :p</p>
            <button class="start-btn">start</button>
        </div>

        <!-- playing card ui -->
        <div class="playing card">
            <div class="pc-header">
                <p class="score-label">score: </p>
            </div>
            <div class="grid-container">
                <!-- grid items here -->
            </div>
        </div>

        <!-- finish card ui -->
        <div class="finish card">
            <h2 class="fc-header">yay done</h2>
            <div class="time-div">
                <h3 class="fc-time-header">your time</h3>
                <h4 class="fc-time-label">2:21</h4>
            </div>
            <button class="restart-btn">restart</button>

            <div class="records-div">
                <h4 class="records-header">records</h2>
                <p class="records-label"></p>
            </div>
        </div>


    </main>
    <footer><a href="https://github.com/halovii">halovii</a> 13/05/26</footer>
</body>
</html>
